<!doctype html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ফার্স্ট এইড ও জরুরি গাইড</title>
<meta name="description" content="ইন্টারনেট ছাড়াই চলে — বাংলায় প্রাথমিক চিকিৎসা, সিপিআর গাইড ও জরুরি নম্বর">
<meta name="theme-color" content="#c62828">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<style>:root{--red:#c62828;--red2:#8e0000;--bg:#fff7f5;--ink:#1c1b1f;--mut:#6b6370;--card:#fff;--ok:#2e7d32;--or:#e65100;--fs:17px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:"Noto Sans Bengali","Kalpurush","SolaimanLipi","Nirmala UI",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:var(--fs);line-height:1.55}
button,a{font:inherit;color:inherit}
button{border:0;cursor:pointer}
#app{max-width:560px;margin:0 auto;padding:0 14px 110px;min-height:100vh}
.hd{position:sticky;top:0;z-index:5;background:linear-gradient(180deg,var(--bg) 75%,rgba(255,247,245,0));display:flex;align-items:center;gap:8px;padding:10px 0}
.hd h1{flex:1;margin:0;font-size:1.15em;color:var(--red2);line-height:1.25}
.ib{width:44px;height:44px;border-radius:50%;background:#fff;box-shadow:0 2px 6px #0003;display:grid;place-items:center;font-size:20px;flex:none;text-decoration:none}
.sos{display:flex;align-items:center;justify-content:center;gap:12px;background:var(--red);color:#fff;text-decoration:none;border-radius:20px;padding:16px;font-weight:800;font-size:1.3em;box-shadow:0 5px 0 var(--red2),0 8px 16px #0003;margin:8px 0 14px}
.sos small{display:block;font-weight:500;font-size:.62em;opacity:.95}
.sos:active{transform:translateY(3px);box-shadow:0 2px 0 var(--red2)}
.sos span{font-size:1.9em}
.warn{background:#fff3cd;border-radius:14px;padding:10px 12px;font-size:.88em;color:#5d4300;margin:8px 0}
.srch{width:100%;padding:13px 14px;border-radius:14px;border:2px solid #e3c8c4;font:inherit;background:#fff;margin:4px 0 10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.tile{background:#fff;border-radius:18px;padding:14px 8px;text-align:center;box-shadow:0 2px 8px #0002;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:100px;border-bottom:5px solid var(--c,#ccc);text-decoration:none;color:var(--ink)}
.tile i{font-style:normal;font-size:36px;line-height:1.1}
.tile small{font-weight:400;color:var(--mut);font-size:.72em}
.tile:active{transform:scale(.97)}
h2{font-size:1.05em;margin:18px 2px 6px;color:var(--red2)}
.item{display:flex;align-items:center;gap:12px;background:#fff;border-radius:16px;padding:12px 14px;margin:8px 0;box-shadow:0 2px 6px #0002;text-decoration:none;color:var(--ink);border-left:6px solid var(--c,#ccc)}
.item i{font-style:normal;font-size:30px;flex:none}
.item b{display:block;line-height:1.3}
.item small{color:var(--mut)}
.chip{display:inline-block;border-radius:99px;padding:3px 11px;font-size:.78em;font-weight:700;color:#fff;white-space:nowrap}
.chip.r{background:var(--red)}.chip.o{background:var(--or)}.chip.g{background:var(--ok)}.chip.m{background:#ad1457}
.box{background:#fff;border-radius:16px;padding:14px;margin:12px 0;box-shadow:0 2px 6px #0002}
.box.when{background:#ffebee;border:2px solid #ef9a9a}
.box.no{background:#fff1f0;border-left:6px solid var(--red)}
.box.note{background:#e8f5e9;border-left:6px solid var(--ok)}
.box h3{margin:0 0 6px;font-size:1em}
ol.st{list-style:none;counter-reset:s;padding:0;margin:0}
ol.st li{counter-increment:s;display:flex;gap:10px;background:#fff;border-radius:16px;padding:12px;margin:9px 0;box-shadow:0 2px 6px #0002;font-size:1.04em}
ol.st li:before{content:counter(s);flex:none;width:32px;height:32px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;font-weight:800}
ul.nl{margin:6px 0 0;padding-left:20px}
ul.nl li{margin:5px 0}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:9;background:#fff;box-shadow:0 -3px 12px #0003;padding:8px 12px calc(8px + env(safe-area-inset-bottom))}
.bar div{max-width:560px;margin:0 auto;display:flex;gap:8px}
.btn{display:flex;align-items:center;justify-content:center;gap:6px;flex:1;padding:13px 10px;border-radius:14px;background:#37474f;color:#fff;font-weight:800;text-decoration:none;text-align:center;border:0}
.btn.r{background:var(--red)}.btn.g{background:var(--ok)}.btn.w{background:#fff;color:#37474f;border:2px solid #37474f}
.btn.sm{padding:8px 12px;font-size:.9em;flex:none}
.row{display:flex;gap:8px;flex-wrap:wrap}
.tabs{display:flex;gap:8px;margin:8px 0}
.tab{flex:1;padding:11px 6px;border-radius:14px;background:#fff;box-shadow:0 1px 4px #0003;font-weight:800}
.tab.on{background:var(--red);color:#fff}
.pulse{width:170px;height:170px;margin:14px auto;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;font-size:62px;font-weight:800;box-shadow:0 0 0 0 #c6282880}
.pulse.go{animation:pl .5454s ease-out infinite}
@keyframes pl{0%{transform:scale(1);box-shadow:0 0 0 0 #c6282899}30%{transform:scale(1.09)}100%{transform:scale(1);box-shadow:0 0 0 34px #c6282800}}
.cnt{text-align:center;font-size:1.1em;font-weight:700}
.fld{display:block;margin:10px 0}
.fld span{display:block;font-size:.85em;color:var(--mut);margin-bottom:3px}
input,select,textarea{font:inherit;width:100%;padding:11px 12px;border-radius:12px;border:2px solid #d9c4c0;background:#fff;color:var(--ink)}
.kv{display:grid;grid-template-columns:110px 1fr;gap:6px 10px;font-size:1.02em}
.kv b{color:var(--mut);font-weight:600}
.card-big{background:#fff;border:4px solid var(--red);border-radius:20px;padding:14px;margin:10px 0}
.card-big h3{margin:0 0 8px;color:var(--red);font-size:1.15em}
.chk{display:flex;gap:12px;align-items:flex-start;background:#fff;border-radius:14px;padding:12px;margin:7px 0;box-shadow:0 1px 4px #0002}
.chk input{width:24px;height:24px;flex:none;margin-top:2px}
.chk.on span{text-decoration:line-through;color:var(--mut)}
.myth{background:#fff;border-radius:16px;padding:12px 14px;margin:9px 0;box-shadow:0 2px 6px #0002}
.myth b{display:block;color:var(--red)}
.full{position:fixed;inset:0;z-index:50;display:grid;place-items:center;text-align:center;font-weight:800;font-size:1.3em;padding:20px}
.full.w{background:#fff;color:#222}
.full.s{background:#000;color:#fff;animation:sosb 1.2s steps(1) infinite}
@keyframes sosb{0%,100%{background:#d50000}50%{background:#000}}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#222;color:#fff;padding:11px 18px;border-radius:99px;z-index:60;max-width:90vw}
.muted{color:var(--mut);font-size:.88em}
.big{font-size:1.5em;font-weight:800}
@media (prefers-color-scheme:dark){:root{--bg:#1a1214;--ink:#f3e9e7;--mut:#b9a9a6;--card:#2a1d20}.tile,.item,.box,ol.st li,.chk,.myth,.ib,.tab,.srch,input,select,textarea,.card-big,.bar{background:#2a1d20;color:var(--ink)}.hd{background:linear-gradient(180deg,#1a1214 75%,transparent)}.warn{background:#4a3a10;color:#ffe8a3}.box.when{background:#4a1f22;border-color:#a33}.box.no{background:#3a1f1f}.box.note{background:#1f3a22}.btn.w{background:#2a1d20;color:#fff;border-color:#888}.hd h1,h2{color:#ff8a80}.tile,.item{color:var(--ink)}}
@media print{.bar,.hd .ib,.sos{display:none}}
</style></head>

/* s: r=এখনই ৯৯৯, o=দ্রুত হাসপাতাল, g=বাসায় যত্ন + প্রয়োজনে ডাক্তার */
const T=[

{id:'choke',c:'life',i:'😮',t:'গলায় খাবার আটকানো (প্রাপ্তবয়স্ক/বড় শিশু)',s:'r',k:'choking গলায় আটকে দম বন্ধ খাবার',
 w:'কাশতে, কথা বলতে বা শ্বাস নিতে না পারলে এবং কাশির শক্তি কমে এলে এখনই ৯৯৯-এ ফোন দিতে বলুন।',
 a:['যদি জোরে কাশতে পারে, কথা বলতে পারে — কাশতে উৎসাহ দিন। পিঠে চাপড়াবেন না, কিছু খাওয়াবেন না।','কাশতে না পারলে বা শব্দ না হলে: পাশে দাঁড়িয়ে এক হাতে বুক ধরুন, সামনে ঝুঁকিয়ে দিন।','অন্য হাতের তালুর গোড়া দিয়ে দুই কাঁধের হাড়ের মাঝখানে জোরে ৫ বার আঘাত করুন।','না বেরোলে: পেছন থেকে জড়িয়ে ধরুন। এক হাতের মুঠো নাভির সামান্য ওপরে রেখে অন্য হাতে ধরে ভেতরের দিকে ও ওপরের দিকে জোরে ৫ বার ঝটকা দিন (হেইমলিক)।','৫ বার পিঠে আঘাত ও ৫ বার পেটে চাপ — এভাবে পালা করে চালিয়ে যান, জিনিসটি বের না হওয়া পর্যন্ত বা সাহায্য আসা পর্যন্ত।','অজ্ঞান হয়ে গেলে শুইয়ে দিন, ৯৯৯-এ ফোন দিন এবং সিপিআর শুরু করুন।'],
 d:['আঙুল ঢুকিয়ে অন্ধভাবে খোঁচাবেন না।','বেরিয়ে গেলেও ডাক্তার দেখিয়ে নিন (পেটে চাপ দিলে ভেতরে আঘাত লাগতে পারে)।'],
 n:'অন্তঃসত্ত্বা বা খুব মোটা মানুষের ক্ষেত্রে পেটের বদলে বুকের মাঝখানে (সিপিআরের জায়গায়) চাপ দিন।'},
{id:'chokeb',c:'life',i:'👶',t:'শিশুর গলায় আটকানো (১ বছরের কম)',s:'r',k:'শিশু বাচ্চা গলায় আটকে choking infant ১ বছর',
 w:'শিশু কাঁদতে বা শ্বাস নিতে না পারলে এবং ঠোঁট নীল হলে এখনই ৯৯৯।',
 a:['কাশছে বা কাঁদছে — শিশুকে নিজে কাশতে দিন, কাছে থাকুন।','শব্দ না হলে: শিশুকে উপুড় করে আপনার বাহুতে শোয়ান, মাথা বুকের চেয়ে নিচে থাকবে। চোয়াল আলতো ধরে রাখুন।','তালুর গোড়া দিয়ে দুই কাঁধের মাঝখানে ৫ বার জোরে চাপড় দিন।','এবার চিত করে মাথা নিচু রেখে শোয়ান। দুই আঙুল বুকের মাঝখানে (স্তনবৃন্তের রেখার সামান্য নিচে) রেখে ৫ বার চাপ দিন।','জিনিস না বেরোলে ৫ চাপড় + ৫ বুকে চাপ পালা করে চালান।','অজ্ঞান হলে শিশুর সিপিআর (হৃদস্পন্দন পাতা দেখুন) শুরু করুন ও ৯৯৯-এ ফোন দিন।'],
 d:['শিশুদের পেটে ঝটকা (হেইমলিক) দেবেন না।','মুখে আঙুল দিয়ে অন্ধভাবে খুঁজবেন না — দেখা গেলে তবেই বের করুন।','শিশুকে ঝুলিয়ে ঝাঁকাবেন না।']},
{id:'bleed',c:'life',i:'🩸',t:'প্রচুর রক্তপাত',s:'r',k:'রক্ত bleeding রক্তক্ষরণ কেটে গেছে রক্ত থামছে না',
 w:'রক্ত ফিনকি দিয়ে বেরোলে, ভিজে যাচ্ছে বা থামছে না — এখনই ৯৯৯ ও হাসপাতাল।',
 a:['নিজেকে নিরাপদ রাখুন। সম্ভব হলে গ্লাভস বা পলিথিন হাতে পরুন।','পরিষ্কার কাপড়/গজ/রুমাল দিয়ে ক্ষতের ওপর সরাসরি জোরে চেপে ধরুন। অন্তত ১০ মিনিট ছাড়বেন না।','কাপড় ভিজে গেলে খুলবেন না — ওপরে আরও কাপড় রেখে চেপে ধরুন।','হাড় ভাঙার সন্দেহ না থাকলে আহত হাত/পা হৃদয়ের উচ্চতার ওপরে তুলে ধরুন।','চেপে ধরা অবস্থায়ই শক্ত করে ব্যান্ডেজ বা কাপড়ের ফালি বাঁধুন।','আহত ব্যক্তিকে শুইয়ে দিন, পা সামান্য উঁচু করুন (পায়ে আঘাত না থাকলে), কম্বল/চাদরে গরম রাখুন। কিছু খেতে দেবেন না।','ক্ষতে বিঁধে থাকা জিনিস (ছুরি, লোহা, কাচ) টেনে বের করবেন না — চারপাশে কাপড় ঠেসে চাপ দিন।','চাপ দিয়েও হাত/পায়ের জীবনঘাতী রক্ত না থামলে (শেষ উপায়): ক্ষতের ৫-৭ সেমি ওপরে (জয়েন্টের ওপরে নয়) চওড়া কাপড়ের ফালি শক্ত করে বেঁধে রক্ত থামান। সময় লিখে রাখুন এবং হাসপাতালে জানান। ঢিলা করবেন না।'],

{id:'unc',c:'life',i:'😴',t:'অজ্ঞান কিন্তু শ্বাস নিচ্ছে',s:'r',k:'অজ্ঞান unconscious অচেতন জ্ঞান নেই recovery position কাত',
 w:'সাড়া না দিলে সবসময় ৯৯৯-এ ফোন দিন।',
 a:['কাঁধে আলতো চাপড় দিয়ে জোরে ডাকুন: "আপনি শুনতে পাচ্ছেন?"','সাড়া না দিলে সাহায্য ডাকুন ও ৯৯৯-এ ফোন দিন।','মুখের কাছে মুখ নিয়ে ১০ সেকেন্ড দেখুন: বুক উঠছে? শ্বাসের শব্দ পাচ্ছেন? শ্বাস না থাকলে সিপিআর করুন।','শ্বাস থাকলে কাত করে শোয়ান (রিকভারি পজিশন): কাছের দিকের হাত শরীরের সাথে সমকোণে রাখুন, দূরের হাত বুকের ওপর দিয়ে এনে গালের নিচে রাখুন, দূরের পায়ের হাঁটু ভাঁজ করে আপনার দিকে গড়িয়ে কাত করুন।','মাথা সামান্য পেছনে হেলিয়ে মুখ নিচের দিকে রাখুন যাতে বমি/লালা বেরিয়ে যায়।','সাহায্য না আসা পর্যন্ত প্রতি মিনিটে শ্বাস দেখুন। গায়ে চাদর দিন।'],
 d:['মুখে পানি, খাবার বা ওষুধ দেবেন না।','ঘাড়/মেরুদণ্ডে আঘাত সন্দেহ হলে (উঁচু থেকে পড়া, দুর্ঘটনা) অকারণে নাড়াবেন না — তবে শ্বাস না থাকলে বা বমিতে দম আটকালে সরাতেই হবে।','বসিয়ে বা দাঁড় করিয়ে রাখবেন না।']},

 w:'বুকে চাপ/ব্যথা ১০ মিনিটের বেশি থাকলে বা ঘাম, শ্বাসকষ্ট, বমি-বমি ভাব থাকলে সঙ্গে সঙ্গে ৯৯৯।',
 a:['লক্ষণ: বুকে চাপ বা ভার, ব্যথা বাম হাত/চোয়াল/ঘাড়/পিঠে ছড়ানো, ঠান্ডা ঘাম, শ্বাসকষ্ট, বমি বমি ভাব, হঠাৎ দুর্বলতা।','নারী, ডায়াবেটিস রোগী ও বয়স্কদের লক্ষণ অনেক সময় কম থাকে — শুধু অস্বস্তি, বদহজমের মতো মনে হতে পারে। সন্দেহ হলে অবহেলা নয়।','এখনই ৯৯৯-এ ফোন দিন এবং রোগীকে কোনো কাজ করতে দেবেন না।','আধশোয়া অবস্থায় আরাম করে বসান, হাঁটু ভাঁজ করে পেছনে ঠেস দিন। টাইট জামা ঢিলা করুন।','অ্যালার্জি না থাকলে এবং ডাক্তার নিষেধ না করে থাকলে একটি অ্যাসপিরিন (৩০০ মিগ্রা) চিবিয়ে খেতে দিন। কাছে না থাকলে সময় নষ্ট করবেন না।','ডাক্তার আগে নাইট্রোগ্লিসারিন দিয়ে থাকলে নির্দেশ মতো ব্যবহার করুন।','অজ্ঞান ও শ্বাস না থাকলে সঙ্গে সঙ্গে সিপিআর শুরু করুন।'],
 d:['হেঁটে বা নিজে নিজে হাসপাতালে যেতে দেবেন না — অ্যাম্বুলেন্স/গাড়িতে নিন।','"গ্যাসের ব্যথা" ভেবে অপেক্ষা করবেন না।','অ্যাসপিরিন শিশুকে দেবেন না।']},
{id:'stroke',c:'life',i:'🧠',t:'স্ট্রোকের সন্দেহ',s:'r',k:'স্ট্রোক stroke মুখ বাঁকা হাত অবশ কথা জড়িয়ে যাচ্ছে',
 w:'এই লক্ষণগুলোর একটিও হঠাৎ দেখা দিলে এখনই ৯৯৯ — প্রতি মিনিট মূল্যবান।',
 a:['মনে রাখুন BE-FAST: ব্যালান্স (হঠাৎ টলমল/মাথা ঘোরা), চোখ (হঠাৎ ঝাপসা বা দেখতে না পাওয়া), মুখ (এক পাশ বেঁকে যাওয়া), হাত (এক হাত/পা দুর্বল বা অবশ), কথা (জড়িয়ে যাওয়া বা বুঝতে না পারা), সময় (এখনই ফোন)।','হাসতে বলুন, দুই হাত তুলতে বলুন, একটি বাক্য বলতে বলুন।','কখন শুরু হয়েছে সেই সময় লিখে রাখুন বা মনে রাখুন — চিকিৎসকের জন্য জরুরি।','এখনই ৯৯৯ বা নিকটস্থ বড় হাসপাতালে নিন (যেখানে সিটি স্ক্যানের ব্যবস্থা আছে)।','মাথা ও কাঁধ সামান্য উঁচু করে শোয়ান। ঝিমিয়ে পড়লে কাত করে শোয়ান।','প্রয়োজনে সিপিআরের জন্য প্রস্তুত থাকুন।'],
 d:['কিছু খাওয়াবেন না, পানি, ওষুধ বা অ্যাসপিরিনও না।','"ঘুমিয়ে নিলে ঠিক হবে" বলে অপেক্ষা করবেন না।','ঝাড়ফুঁক বা ঘরোয়া চিকিৎসায় সময় নষ্ট করবেন না।']},
{id:'anaph',c:'life',i:'🐝',t:'মারাত্মক অ্যালার্জি (অ্যানাফাইলেক্সিস)',s:'r',k:'অ্যালার্জি allergy anaphylaxis ফোলা শ্বাসকষ্ট পোকা খাবার ওষুধ র‍্যাশ',
 w:'ঠোঁট/মুখ/গলা ফুলে গেলে বা শ্বাসকষ্ট হলে এখনই ৯৯৯।',
 a:['লক্ষণ: ঠোঁট-মুখ-গলা ফোলা, শ্বাসে শব্দ বা কষ্ট, শরীরে লাল দাগ/চুলকানি, মাথা ঘোরা, ফ্যাকাশে ভাব, পেটব্যথা-বমি — কিছু খাওয়া, ওষুধ নেওয়া বা পোকার কামড়ের পর।','এখনই ৯৯৯-এ ফোন দিন।','রোগীর নিজের এপিনেফ্রিন অটো-ইনজেক্টর থাকলে নির্দেশ মতো উরুর বাইরের দিকে (জামার ওপর দিয়েই) দিন। ৫-১৫ মিনিটে উন্নতি না হলে ও দ্বিতীয়টি থাকলে আবার দিন।','শুইয়ে পা সামান্য উঁচু করুন। শ্বাসকষ্ট বেশি হলে আধশোয়া/বসা অবস্থায় রাখুন। হঠাৎ দাঁড় করাবেন না।','কারণ জানা থাকলে (যেমন চিংড়ি, বাদাম, কোনো ওষুধ) আর দেবেন না এবং কী খেয়েছিল ডাক্তারকে বলুন।','শ্বাস বন্ধ হয়ে গেলে সিপিআর।'],
 d:['"কমে গেছে" ভেবে হাসপাতাল এড়াবেন না — কিছুক্ষণ পর আবার বাড়তে পারে।','মুখে কিছু খাওয়াবেন না।']},
{id:'seiz',c:'life',i:'⚡',t:'খিঁচুনি / মৃগী',s:'o',k:'খিঁচুনি seizure convulsion মৃগী epilepsy ফিট',
 w:'৫ মিনিটের বেশি চললে, বারবার হলে, প্রথমবার হলে, আঘাত পেলে, পানিতে হলে, গর্ভবতী হলে, বা জ্ঞান না ফিরলে ৯৯৯।',
 a:['শান্ত থাকুন। সময় দেখে নিন কখন শুরু হলো।','চারপাশ থেকে শক্ত/ধারালো জিনিস সরিয়ে দিন। মাথার নিচে নরম কিছু (কাপড়, ব্যাগ) দিন।','গলার কাছের জামা, টাই, চশমা ঢিলা বা খুলে দিন।','খিঁচুনি থামলে কাত করে শোয়ান (রিকভারি পজিশন)। লালা/বমি বেরোতে দিন।','জ্ঞান ফেরা পর্যন্ত পাশে থাকুন, শান্তভাবে কথা বলুন। ফেরার পর বিভ্রান্ত থাকতে পারে।','সম্পূর্ণ সুস্থ না হওয়া পর্যন্ত খাবার/পানি দেবেন না।'],
 d:['শরীর চেপে ধরবেন না।','মুখে চামচ, কাপড়, আঙুল বা কিছুই ঢোকাবেন না — জিভ গিলে ফেলার ভয় অমূলক।','জুতা/পেঁয়াজ/তালা শোঁকানো — এসব ভুল প্রথা, করবেন না।'],
 n:'শিশুর জ্বরের খিঁচুনিতেও একই ব্যবস্থা। শিশুকে ঠান্ডা পানিতে চুবাবেন না; খিঁচুনি থামলে আলতো করে গা মুছে ডাক্তার দেখান।'},
{id:'drown',c:'life',i:'🌊',t:'পানিতে ডোবা',s:'r',k:'ডুবে গেছে drowning পুকুর নদী পানি শিশু',
 w:'ডুবে যাওয়া প্রত্যেককেই হাসপাতালে দেখাতে হবে — ভালো মনে হলেও (ফুসফুসে পানি গেলে পরে বিপদ হতে পারে)।',
 a:['নিজে ঝাঁপ দেবেন না। হাত বাড়ান, লাঠি/গামছা/দড়ি/বাঁশ বা ভাসমান কিছু (ড্রাম, জগ) ছুঁড়ে দিন।','অন্যদের ডাকুন ও ৯৯৯-এ ফোন দিন।','তীরে তুলে সমতল জায়গায় চিত করে শোয়ান।','শ্বাস না থাকলে এখনই ৫ বার মুখে মুখ লাগিয়ে শ্বাস দিন (প্রশিক্ষণ থাকলে), তারপর ৩০ চাপ : ২ শ্বাস নিয়মে সিপিআর। প্রশিক্ষণ না থাকলে শুধু বুকে চাপ।','শ্বাস থাকলে কাত করে শোয়ান। ভেজা কাপড় খুলে শুকনো কাপড়ে ঢেকে গরম রাখুন।','হাসপাতালে নেওয়া পর্যন্ত নজর রাখুন।'],
 d:['পেটে চাপ দিয়ে পানি বের করার চেষ্টা করবেন না — সময় নষ্ট ও বমির ঝুঁকি।','ঝুলিয়ে/কাঁধে ফেলে দৌড়াবেন না।','কাউকে বাঁচাতে গিয়ে নিজে বিপদে পড়বেন না।'],
 n:'শিশুরা নিঃশব্দে ডুবে যায়। পুকুর-ডোবার পাড়ে বেড়া, ১-৪ বছর শিশুকে চোখে চোখে রাখা বা শিশু-দিবাযত্ন কেন্দ্র (আঁচল ইত্যাদি) নিরাপদ।'},
{id:'elec',c:'life',i:'🔌',t:'বিদ্যুৎস্পৃষ্ট',s:'r',k:'বিদ্যুৎ electric shock শক ইলেকট্রিক কারেন্ট',
 w:'বিদ্যুৎস্পৃষ্ট প্রত্যেককে হাসপাতালে দেখানো উচিত — হৃদস্পন্দনে গোলমাল পরে ধরা পড়তে পারে।',
 a:['আগে নিজে নিরাপদ হন: মেইন সুইচ/প্লাগ বন্ধ করুন বা মিটার/ফিউজ বন্ধ করুন।','সুইচ বন্ধ করা না গেলে শুকনো কাঠ, প্লাস্টিক বা শুকনো দড়ি/কাপড় দিয়ে ব্যক্তিকে তার থেকে সরান — নিজে শুকনো জায়গায় দাঁড়ান, খালি হাতে ছোঁবেন না।','হাই-ভোল্টেজ লাইন (পিলার, ছেঁড়া তার) হলে অন্তত ১৮ মিটার দূরে থাকুন ও ৯৯৯ ও বিদ্যুৎ অফিসে জানান।','এবার ৯৯৯-এ ফোন দিন। শ্বাস না থাকলে সিপিআর শুরু করুন।','পোড়ার জায়গা ২০ মিনিট ঠান্ডা (বরফ নয়) পানিতে ঢালুন ও পরিষ্কার কাপড়ে ঢাকুন।'],
 d:['ভেজা অবস্থায় বা ভেজা মেঝেতে দাঁড়িয়ে ধরবেন না।','ধাতব বা ভেজা জিনিস দিয়ে সরাবেন না।']},

 a:['রোগীকে সোজা হয়ে বসান ও শান্ত রাখুন। জামা ঢিলা করুন।','রোগীর নিজের রিলিভার ইনহেলার (সাধারণত নীল) থাকলে স্পেসার দিয়ে এক পাফ করে ৪ পাফ দিন, প্রতিটির পর ৪টি শ্বাস নিতে বলুন।','৪ মিনিট অপেক্ষা করুন। উন্নতি না হলে আবার ৪ পাফ দিন ও ৯৯৯-এ ফোন দিন।','ধুলো, ধোঁয়া, পোষা প্রাণী, ধূপ ইত্যাদি কারণ থেকে সরিয়ে নিন। জানালা খুলে বাতাস আসতে দিন।','হাসপাতালে যাওয়ার সময় ইনহেলার সাথে রাখুন।'],
 d:['শুইয়ে দেবেন না — বসা ভালো।','অন্যের ইনহেলার/ওষুধ ডাক্তার ছাড়া দেবেন না (শ্বাসকষ্ট নিশ্চিত হাঁপানি হলে রিলিভার ছাড়া)।'],
 n:'শিশুদের শ্বাসকষ্টে পাঁজর দেবে যাওয়া, দ্রুত শ্বাস, বুকে শব্দ — এগুলো বিপদের চিহ্ন; নিউমোনিয়াও হতে পারে, দেরি করবেন না।'},

 a:['আগুন থেকে বা গরম জিনিস থেকে সরে আসুন। কাপড়ে আগুন ধরলে দৌড়াবেন না: থামুন, মাটিতে শুয়ে গড়াগড়ি দিন (বা কম্বল চাপা দিন)।','পোড়া জায়গা সঙ্গে সঙ্গে ২০ মিনিট ঠান্ডা চলমান পানিতে (কল/বালতি/মগ) ধরে রাখুন। খুব ঠান্ডা বরফ নয়।','আটকে না থাকলে আংটি, ঘড়ি, চুড়ি, টাইট কাপড় খুলে ফেলুন (ফুলে গেলে আর খোলা যাবে না)।','পরিষ্কার, ঝুরঝুরে নয় এমন কাপড় বা প্লাস্টিক র‍্যাপ/ক্লিং ফিল্ম দিয়ে ঢিলেভাবে ঢাকুন।','ব্যথায় প্যারাসিটামল দেওয়া যায় (প্যাকেটের মাত্রা অনুযায়ী)। পানি পান করান।','শরীর ঠান্ডা না লাগে সেদিকে নজর দিন — বড় পোড়ায় শরীর ঠান্ডা হয়ে যায়।'],

 w:'হাড় বেঁকে গেলে, চামড়া ফুটে হাড় বেরোলে, ঘাড়/পিঠ/মাথা/উরু/কোমরে আঘাত হলে, বা নাড়ানো যাচ্ছে না — হাসপাতাল; গুরুতর হলে ৯৯৯।',
 a:['আহত অংশ যে অবস্থায় আছে সেভাবেই রাখুন; সোজা করার চেষ্টা করবেন না।','রক্ত থাকলে আগে "প্রচুর রক্তপাত" নিয়মে থামান। খোলা ক্ষত পরিষ্কার কাপড়ে ঢাকুন, হাড় ঠেলে ঢোকাবেন না।','ভাঙা অংশের ওপরের ও নিচের দুই জয়েন্টসহ শক্ত কিছু (কাঠ, ভাঁজ করা কাগজ/পত্রিকা, ছাতা) দিয়ে নরম কাপড় ভরে বেঁধে স্প্লিন্ট করুন।','বাঁধন এত টাইট নয় যে আঙুল নীল/ঠান্ডা হয়ে যায়।','ফুলে যাওয়া কমাতে কাপড়ে মোড়ানো বরফ ২০ মিনিট দিয়ে রাখুন।','সম্ভব হলে অংশটি উঁচু রাখুন। রোগীকে নড়াচড়া ছাড়া হাসপাতালে নিন।','অস্ত্রোপচার লাগতে পারে, তাই কিছু খেতে-পান করতে দেবেন না (ঠোঁট ভেজানো যাবে)।'],
 d:['টেনে সোজা করবেন না বা জোরে মালিশ করবেন না।','ঝাড়ফুঁক, বোনসেটার বা অন্ধভাবে টানাটানিতে সময় নষ্ট করবেন না।','ঘাড়/মেরুদণ্ডে আঘাত সন্দেহ হলে নাড়াবেন না (জীবন বিপদ ছাড়া)।'],
 n:'মচকানোতে সংক্ষেপে: বিশ্রাম, কাপড়ে মোড়ানো বরফ, ব্যান্ডেজে হালকা চাপ, উঁচু করে রাখা। ২-৩ দিনে না কমলে এক্স-রে করান।'},

 a:['আহত ব্যক্তিকে নাড়াচাড়া কমিয়ে শান্ত রাখুন। ঘাড়ে আঘাত সন্দেহ থাকলে মাথা-ঘাড় সোজা ধরে রাখুন।','রক্ত বেরোলে পরিষ্কার কাপড় দিয়ে আলতো চেপে ধরুন (খুলি ভাঙার সন্দেহ হলে জোরে নয়)।','ফোলা জায়গায় কাপড়ে মোড়ানো ঠান্ডা সেঁক ২০ মিনিট দিন।','পরবর্তী ২৪ ঘণ্টা নজরে রাখুন। ঘুমালে মাঝে মাঝে জাগিয়ে দেখুন সাড়া দেয় কি না।','ছোট শিশু (বিশেষ করে ১ বছরের কম) মাথায় আঘাত পেলে — ছোট হলেও ডাক্তার দেখান।'],
 d:['গুরুতর হলে কিছু খেতে-পান করতে দেবেন না।','নিজে নিজে হাঁটিয়ে বা মোটরসাইকেলে চাপিয়ে নেবেন না।','ক্ষত থেকে জমাট রক্ত বা বেরিয়ে আসা কিছু টেনে বের করবেন না।']},

 a:['সোজা হয়ে বসুন এবং সামান্য সামনে ঝুঁকুন।','নাকের নরম অংশ (নাকের ছিদ্রের ওপরের নরম জায়গা) দুই আঙুলে চেপে ১০-১৫ মিনিট ধরে রাখুন, ঘড়ি দেখে। মাঝে ছাড়বেন না।','মুখ দিয়ে শ্বাস নিন। রক্ত গিলে না ফেলে থুথু দিয়ে ফেলুন।','নাকের গোড়ায় ঠান্ডা সেঁক দেওয়া যায়।','থামলে কয়েক ঘণ্টা নাক ঝাড়বেন না, খোঁটাবেন না, গরম পানীয়/ভারী কাজ এড়ান।'],

 a:['সাবান দিয়ে হাত ধুয়ে নিন (সম্ভব হলে গ্লাভস)।','রক্ত বেরোলে পরিষ্কার কাপড় দিয়ে ১০ মিনিট চেপে ধরুন।','চলমান পরিষ্কার পানি দিয়ে ক্ষত ভালো করে ধুয়ে ফেলুন (কয়েক মিনিট)।','ক্ষতের চারপাশ সাবান-পানিতে পরিষ্কার করুন। স্যাভলন/অ্যান্টিসেপটিক পাশে লাগানো যায়।','পরিষ্কার গজ/ব্যান্ডেজে ঢাকুন। রোজ বদলান ও পরিষ্কার-শুকনো রাখুন।','টিটেনাস টিকা কত বছর আগে নিয়েছেন মনে করুন — ময়লা বা গভীর ক্ষতে ৫ বছরের বেশি হলে এবং কখনো না নিয়ে থাকলে ডাক্তারকে জানিয়ে টিকা নিন।'],

 a:['রাসায়নিক (চুন, অ্যাসিড, ব্লিচ, কীটনাশক): সঙ্গে সঙ্গে ১৫-২০ মিনিট পরিষ্কার চলমান পানিতে চোখ খুলে ধুয়ে নিন। মাথা কাত করুন যাতে পানি অন্য চোখে না যায়।','ধুলো/বালি: চোখ কচলাবেন না। বারবার পলক ফেলুন। পরিষ্কার পানি দিয়ে ধুয়ে নিন।','গেঁথে থাকা জিনিস (লোহা, কাঁচ) বের করবেন না। চোখের ওপর না ছুঁয়ে একটি পরিষ্কার কাপ/কাগজের গ্লাস উপুড় করে বেঁধে ঢেকে দিন।','কন্টাক্ট লেন্স থাকলে ধোয়ার পর খুলে ফেলুন (সহজে খুললে)।','হাসপাতালে যান। দুই চোখই ঢেকে রাখলে রোগী কম নড়ে।'],
 d:['চোখ ঘষবেন না।','চোখে ড্রপ বা ওষুধ ডাক্তারের পরামর্শ ছাড়া দেবেন না।','ঘরোয়া জিনিস (দুধ, মধু, চা পাতা) দেবেন না।']},

 a:['স্থায়ী দাঁত হলে ওপরের অংশ (ক্রাউন) ধরুন, শিকড় ছোঁবেন না।','ময়লা থাকলে দুধ বা পরিষ্কার পানিতে সামান্য ধুন, ঘষবেন না।','সম্ভব হলে সঠিক দিক দেখে আস্তে সকেটে বসিয়ে দিন এবং কামড় দিয়ে রাখুন।','না পারলে দুধ বা মুখের লালায় (গালের ভেতরে) রেখে দ্রুত দাঁতের ডাক্তারের কাছে যান।','রক্ত বন্ধ করতে পরিষ্কার কাপড় চেপে ধরুন।'],

 w:'যেকোনো গুরুতর দুর্ঘটনায় ৯৯৯ — আহত ব্যক্তির অবস্থা ও স্থান পরিষ্কার জানান।',
 a:['আগে নিজের নিরাপত্তা: ট্রাফিক থেকে সরে দাঁড়ান। গাড়িতে আগুন/তেল ছড়ানোর বিপদ আছে কি দেখুন।','৯৯৯-এ ফোন দিন, স্থান ও আহতের সংখ্যা জানান।','সাড়া দেয় কি না দেখুন। শ্বাস না থাকলে সিপিআর। রক্ত থাকলে চেপে ধরুন।','আহত ব্যক্তিকে নাড়াবেন না (আগুন/বিপদ ছাড়া) — ঘাড়/মেরুদণ্ডের আঘাত হতে পারে।','হেলমেট খুলবেন না (শ্বাস বন্ধ না হলে)।','গায়ে চাদর দিয়ে গরম রাখুন, আশ্বস্ত করুন। অ্যাম্বুলেন্স না এলে ও আগুনের ভয় থাকলে সাবধানে সরান — মাথা-ঘাড়-পিঠ এক সোজা রেখে কয়েকজন মিলে।'],
 d:['কিছু খাওয়াবেন না।','সবাই ভিড় করে ঘিরে দাঁড়াবেন না — বাতাস দিন।','ভিডিও করার চেয়ে সাহায্য আগে।']},
{id:'ear',c:'hurt',i:'🪱',t:'শিশু গিলে ফেলেছে (ব্যাটারি/চুম্বক/মুদ্রা)',s:'r',k:'গিলে ফেলেছে শিশু ব্যাটারি চুম্বক পয়সা swallowed বোতাম ব্যাটারি',
 w:'বোতাম ব্যাটারি বা একাধিক চুম্বক গিলে ফেললে মুহূর্ত দেরি না করে হাসপাতাল/৯৯৯ — কয়েক ঘণ্টায় মারাত্মক ক্ষতি হতে পারে।',
 a:['কী গিলেছে, কখন, কতগুলো — যতটা জানেন নোট করুন। প্যাকেট/অন্য ব্যাটারি সাথে নিন।','এখনই হাসপাতালে নিন (এক্স-রে লাগবে)।','শিশুর শ্বাসকষ্ট বা গলায় আটকালে "শিশুর গলায় আটকানো" পাতা দেখুন।','হাসপাতালে যাওয়ার পথে শিশুকে কিছু খেতে-পান করতে দেবেন না (ডাক্তার না বলা পর্যন্ত)।'],
 d:['বমি করানোর চেষ্টা করবেন না।','"নিজেই বেরিয়ে যাবে" ভেবে অপেক্ষা করবেন না — অন্তত বোতাম ব্যাটারি/চুম্বকে।','ল্যাক্সেটিভ (জোলাপ) দেবেন না।']},

{id:'snake',c:'env',i:'🐍',t:'সাপে কামড়',s:'r',k:'সাপ snake bite সাপে কামড় বিষ ওঝা',
 w:'যেকোনো সাপে কামড়েই জরুরি — বিষহীন মনে হলেও হাসপাতালে যান। রাতে ঘুমের মধ্যে কামড়ালে (কেউটে/শঙ্খিনী/কালাচ জাতীয়) ব্যথা কম থাকে, তাই গুরুত্ব দিন।',
 a:['শান্ত থাকুন ও রোগীকে শান্ত রাখুন। আতঙ্কে দৌড়ালে বিষ দ্রুত ছড়ায়।','কামড়ের জায়গা নড়াচড়া বন্ধ রাখুন — ভাঙা হাড়ের মতো স্প্লিন্ট বা ব্যান্ডেজে কামড়ানো অংশ স্থির করুন।','আংটি, চুড়ি, ঘড়ি, নূপুর খুলে ফেলুন (পরে ফুলে যাবে)।','রোগীকে শুইয়ে বা আরামে বসিয়ে দ্রুত বড় সরকারি হাসপাতালে (মেডিক্যাল কলেজ/জেলা সদর) নিন — যেখানে অ্যান্টিভেনম ও আইসিইউ/ভেন্টিলেটরের সুবিধা আছে। যাওয়ার আগেই ফোনে জেনে নেওয়া যায়; কিন্তু দেরি করবেন না।','সম্ভব হলে সাপের ছবি তুলুন (নিজে ধরতে/মারতে যাবেন না) — চিকিৎসায় সাহায্য করে।','লক্ষণ: চোখের পাতা ঝুলে পড়া, দুটো দেখা, গিলতে কষ্ট, কথা জড়ানো, শ্বাসকষ্ট, কামড়ের স্থানে ফোলা/রক্ত, মাড়ি বা নাক দিয়ে রক্ত — এসব হলে অতি জরুরি।','শ্বাস বন্ধ হলে সিপিআর/শ্বাস দিন।'],
 d:['কামড়ের জায়গা কাটবেন না, চুষবেন না, চাপ দিয়ে বিষ বের করার চেষ্টা করবেন না।','শক্ত করে টুর্নিকেট বা দড়ি বাঁধবেন না।','বরফ, গরম সেঁক, পোড়া, ঘষা, লেবু, ঘরোয়া ওষুধ বা ওঝা-কবিরাজে সময় নষ্ট করবেন না।','সাপ ধরতে বা মারতে গিয়ে নিজে কামড় খাবেন না।','অ্যালকোহল, কফি বা ওষুধ দেবেন না।'],
 n:'প্রতিরোধ: মাটিতে না ঘুমানো, মশারি টাঙিয়ে চারদিক গুঁজে শোয়া, অন্ধকারে টর্চ ও বুট নিয়ে চলা। সাপের জন্য অ্যান্টিভেনম সব হাসপাতালে নাও থাকতে পারে, তাই ১৬২৬৩-এ আগে জেনে নেওয়ার চেষ্টা করা যায়।'},
{id:'dog',c:'env',i:'🐕',t:'কুকুর/বিড়াল/বানরের কামড় (জলাতঙ্ক)',s:'o',k:'কুকুর কামড় dog bite জলাতঙ্ক rabies বিড়াল বানর আঁচড় ভ্যাকসিন',
 w:'কামড় বা আঁচড় যত ছোটই হোক, একই দিনে চিকিৎসকের কাছে গিয়ে জলাতঙ্ক প্রতিষেধক (টিকা, দরকার হলে ইমিউনোগ্লোবুলিন) নিন। জলাতঙ্ক শুরু হলে প্রায় সবসময় মৃত্যু — কিন্তু সময়মতো টিকা নিলে ১০০% প্রতিরোধযোগ্য।',
 a:['সঙ্গে সঙ্গে সাবান ও চলমান পানিতে অন্তত ১৫ মিনিট ক্ষত ভালো করে ধুয়ে ফেলুন।','এরপর পোভিডন-আয়োডিন বা অ্যান্টিসেপটিক লাগান।','ক্ষত হালকা কাপড়ে ঢাকুন। রক্ত থামাতে চেপে ধরুন।','কুকুর/বিড়ালের মালিকের বা প্রাণীর খোঁজ রাখুন — ১০ দিন সুস্থ আছে কি না লক্ষ করুন (কিন্তু এর জন্য টিকা দেরি করবেন না)।','দ্রুত হাসপাতালে গিয়ে টিকার পুরো কোর্স শুরু করুন; সরকারি হাসপাতালে ব্যবস্থা কোথায় আছে ১৬২৬৩-এ জেনে নিন।','টিটেনাস টিকার কথাও ডাক্তারকে বলুন।'],
 d:['ক্ষতে লঙ্কা, চুন, সাবানের গুঁড়ো, তেল বা ঝাড়ফুঁকের জিনিস লাগাবেন না।','ক্ষত সেলাই বা শক্ত করে বাঁধবেন না।','কুকুর মরে গেলে বা ভালো থাকলেও টিকা এড়াবেন না।']},

 w:'সন্দেহ হলেই ৯৯৯ বা নিকটস্থ হাসপাতালে — লক্ষণ দেরিতে আসতে পারে।',
 a:['রোগীকে বিপদ থেকে সরান। সাড়া, শ্বাস দেখুন। শ্বাস না থাকলে সিপিআর (মুখে মুখে শ্বাসে রাসায়নিক লাগলে শুধু বুকে চাপ)।','কী খেয়েছে, কতটা, কখন — জানুন। খালি বোতল/প্যাকেট/ওষুধের পাতা সঙ্গে নিন।','কীটনাশক ত্বকে লাগলে ভেজা কাপড় খুলে ফেলুন, সাবান-পানিতে ত্বক ধুয়ে নিন (নিজে গ্লাভস পরুন)।','মুখে কিছু থাকলে বের করে কুলকুচি করান (গিলতে না দিয়ে)।','অজ্ঞান হলে কাত করে শোয়ান। বমি করলে মাথা কাত রাখুন।','দ্রুত হাসপাতালে নিন।'],
 d:['জোর করে বমি করাবেন না (লবণ-পানি, আঙুল ইত্যাদি)।','দুধ, ডিম, ঘি, তেল বা লেবু খাওয়াবেন না — সময় নষ্ট হয়, ক্ষতিও বাড়তে পারে।','অ্যাসিড/ব্লিচ/কেরোসিন খেলে বমি করালে আরও ক্ষতি।','রোগী ঘুমিয়ে পড়লে "ঠিক হয়ে গেছে" ভাববেন না।'],
 n:'কীটনাশক বিষ বাংলাদেশে মৃত্যুর বড় কারণ — ঘরে কীটনাশক তালাবদ্ধ ও শিশুর নাগালের বাইরে রাখুন। কেউ ইচ্ছে করে বিষ খেলে "মানসিক ও নিরাপত্তা" অংশের পাতাও দেখুন।'},
{id:'gas',c:'env',i:'🧯',t:'গ্যাস লিক / ধোঁয়ায় দম বন্ধ',s:'r',k:'গ্যাস লিক gas leak সিলিন্ডার চুলা ধোঁয়া কার্বন মনোক্সাইড মাথা ঘোরা',
 w:'গ্যাসের গন্ধ পেলে বা ধোঁয়ায় কেউ অজ্ঞান হলে — এখনই বাইরে, ৯৯৯/১০২।',
 a:['কোনো সুইচ (লাইট, ফ্যান) অন/অফ করবেন না, ম্যাচ/লাইটার জ্বালাবেন না, ঘরের ভেতর মোবাইলে ফোনও করবেন না।','সম্ভব হলে সিলিন্ডার বা গ্যাসের মেইন ভাল্ভ বন্ধ করুন।','দরজা-জানালা সব খুলে দিন এবং সবাইকে নিয়ে খোলা জায়গায় যান।','বাইরে গিয়ে ৯৯৯ বা ১০২/ফায়ার সার্ভিস ও গ্যাস কোম্পানিকে জানান।','কেউ অজ্ঞান হলে খোলা বাতাসে এনে শ্বাস দেখুন; না থাকলে সিপিআর।','মাথা ব্যথা, ঘুম ঘুম, বমি, বিভ্রান্তি — বদ্ধ ঘরে চুলা/জেনারেটর জ্বালানো থাকলে কার্বন মনোক্সাইড বিষক্রিয়া হতে পারে, বাইরে নিয়ে হাসপাতালে যান।'],
 d:['গন্ধ কোথা থেকে আসছে খুঁজতে আগুন বা লাইটার জ্বালাবেন না।','বদ্ধ ঘরে কয়লা/জেনারেটর/গ্যাস হিটার জ্বালিয়ে ঘুমাবেন না।']},
{id:'heat',c:'env',i:'🌡️',t:'হিটস্ট্রোক / অতিরিক্ত গরম',s:'r',k:'হিটস্ট্রোক heatstroke গরম লু রোদে অজ্ঞান',
 w:'শরীর অতি গরম (৪০°সে বা ১০৪°ফা এর ওপরে), বিভ্রান্তি, খিঁচুনি বা অজ্ঞান — হিটস্ট্রোক, এখনই ৯৯৯।',
 a:['রোগীকে ছায়ায়/ঠান্ডা ঘরে নিন। বাড়তি কাপড় খুলে দিন।','সারা শরীরে ঠান্ডা পানি ঢালুন বা ভেজা কাপড় দিয়ে মুছুন, পাখা/বাতাস করুন।','ঘাড়, বগল ও কুঁচকিতে বরফ/ঠান্ডা কাপড় রাখুন।','সজাগ থাকলে ধীরে ধীরে খাবার স্যালাইন (ওআরএস) বা পানি খাওয়ান।','তাপমাত্রা কমলেও (৩৮° এ নামলে ঠান্ডা করা থামান) হাসপাতালে নিন।'],
 d:['অজ্ঞান ব্যক্তিকে খাওয়াবেন না।','জ্বরের ওষুধ (প্যারাসিটামল) হিটস্ট্রোকে কাজ করে না।'],
 n:'হালকা ক্ষেত্রে (হিট এক্সহশন): ঘাম, ক্লান্তি, মাথা ঘোরা, পেশির টান — ছায়ায় বিশ্রাম, ঠান্ডা পানি/ওআরএস, ঠান্ডা কাপড়; এক ঘণ্টায় ভালো না হলে ডাক্তার।'},
{id:'bee',c:'env',i:'🐝',t:'মৌমাছি/বোলতা/পোকার হুল',s:'g',k:'মৌমাছি বোলতা ভিমরুল হুল পোকা কামড় বিছা',
 w:'শ্বাসকষ্ট, মুখ-গলা ফোলা, মাথা ঘোরা বা অনেকগুলো হুল (১০টির বেশি) — ৯৯৯।',
 a:['হুল গেঁথে থাকলে ক্রেডিট কার্ড/নখ/ছুরির পিঠ দিয়ে পাশ থেকে চেঁছে বের করুন (চিমটি দিয়ে চেপে ধরবেন না)।','সাবান-পানিতে ধুয়ে নিন।','ঠান্ডা সেঁক (কাপড়ে মোড়ানো বরফ) ১০-২০ মিনিট দিন।','আক্রান্ত অংশ উঁচু রাখুন। চুলকালে ফার্মাসিস্টের পরামর্শে অ্যান্টিহিস্টামিন নেওয়া যায়।','মুখ/জিভ/গলায় কামড়ালে বা অ্যালার্জির ইতিহাস থাকলে "মারাত্মক অ্যালার্জি" পাতা দেখুন।'],
 d:['চুলকাবেন না, ফোসকা ফাটাবেন না।','চুন, কাদা বা ঘরোয়া জিনিস লাগাবেন না।']},

{id:'dia',c:'sick',i:'💧',t:'ডায়রিয়া ও পানিশূন্যতা (খাবার স্যালাইন)',s:'g',k:'ডায়রিয়া diarrhoea পাতলা পায়খানা কলেরা বমি পানিশূন্য ওআরএস স্যালাইন জিংক',
 w:'পায়খানায় রক্ত, ভাতের মাড়ের মতো পানি, খুব তেষ্টা, চোখ বসে যাওয়া, প্রস্রাব কম/নেই, খেতে বা পান করতে না পারা, ঝিমুনি, জ্বর, ৩ দিনের বেশি চললে বা শিশু/বৃদ্ধ হলে — দ্রুত হাসপাতাল।',
 a:['একটু পর পর খাবার স্যালাইন (ওআরএস) খাওয়ান — প্যাকেটের নিয়মে ১ লিটার পরিষ্কার পানিতে গুলুন। পানি ঠান্ডা/ফোটানো ঠান্ডা হলে ভালো।','প্যাকেট না থাকলে ঘরে বানান: ১ লিটার পরিষ্কার (ফোটানো ঠান্ডা) পানি + ৬ চা-চামচ চিনি (সমান করে) + আধা চা-চামচ লবণ। চা-চামচ সমান ভরা, খুব বেশি লবণ নয়।','প্রতিবার পাতলা পায়খানার পর: শিশু ২ বছরের কম হলে ছোট চামচে/কাপে ৫০-১০০ মিলি, বড় শিশু ও প্রাপ্তবয়স্ক যত পারে।','বমি করলে ১০ মিনিট থেমে আবার ধীরে ধীরে চামচে চামচে দিন।','শিশুদের জিংক ট্যাবলেট ১০-১৪ দিন: ৬ মাসের কম ১০ মিগ্রা/দিন, ৬ মাসের বেশি ২০ মিগ্রা/দিন (ডাক্তার/প্যাকেটের নির্দেশ দেখুন)।','খাওয়া চালিয়ে যান — ভাত, খিচুড়ি, কলা। বুকের দুধ বন্ধ করবেন না।','হাত ও পাত্র সাবানে ধোবেন, পানি ফুটিয়ে খাবেন।'],
 d:['কোমল পানীয়, ফলের জুস (প্যাকেট), চা-কফি দিয়ে পানির ঘাটতি পূরণ চেষ্টা করবেন না।','নিজে নিজে অ্যান্টিবায়োটিক বা ডায়রিয়া বন্ধ করার ওষুধ দেবেন না (বিশেষ করে শিশুকে)।','খাওয়া বন্ধ করবেন না।']},
{id:'fev',c:'sick',i:'🌡️',t:'জ্বর (বড় ও শিশু)',s:'g',k:'জ্বর fever তাপমাত্রা শিশুর জ্বর প্যারাসিটামল',
 w:'৩ মাসের কম শিশুর যেকোনো জ্বর, ঘাড় শক্ত, গায়ে লালচে দাগ, খিঁচুনি, শ্বাসকষ্ট, ঝিমুনি/সাড়া কম, পান না করা, ৩ দিনের বেশি জ্বর, বা ডেঙ্গু সন্দেহ — ডাক্তার/হাসপাতাল দ্রুত।',
 a:['জ্বর মাপুন (বগলে ৩৭.৫°সে/৯৯.৫°ফা-এর বেশি জ্বর ধরুন)।','হালকা পাতলা কাপড় পরান, ঘর বাতাসযুক্ত রাখুন।','প্রচুর পানি, খাবার স্যালাইন, স্যুপ, ডাবের পানি দিন।','কুসুম গরম (হালকা উষ্ণ) পানিতে কাপড় ভিজিয়ে শরীর মুছে দিন — বরফ-ঠান্ডা নয়।','প্যারাসিটামল দিতে পারেন — প্যাকেটের গায়ে লেখা বা ডাক্তার/ফার্মাসিস্টের বলা বয়স-ওজন অনুযায়ী মাত্রা অনুসরণ করুন এবং সময়ের ব্যবধান মানুন। শিশুকে অ্যাসপিরিন কখনো নয়।','বিশ্রাম নিন, ২৪-৪৮ ঘণ্টায় সমস্যা বাড়লে ডাক্তারের কাছে যান।'],
 d:['শিশুকে ঠান্ডা পানিতে চুবাবেন না বা বরফ দেবেন না।','এক সাথে একাধিক জ্বরের ওষুধ বা বেশি মাত্রা দেবেন না।','জ্বরে ডেঙ্গুর সম্ভাবনা থাকলে ব্যথানাশক (আইবুপ্রোফেন, ডাইক্লোফেনাক, অ্যাসপিরিন) খাবেন না।']},
{id:'dengue',c:'sick',i:'🦟',t:'ডেঙ্গু',s:'o',k:'ডেঙ্গু dengue এডিস মশা প্লাটিলেট জ্বর',
 w:'জ্বর কমার সময় (সাধারণত ৩-৭ দিনের মধ্যে) সতর্কতা লক্ষণ দেখা দিলে অপেক্ষা না করে হাসপাতাল: তীব্র পেটব্যথা, বারবার বমি, মাড়ি/নাক/পায়খানা দিয়ে রক্ত, ঝিমুনি/অস্থিরতা, ঠান্ডা ঘামে ভেজা ত্বক, প্রস্রাব কম, শ্বাসকষ্ট।',
 a:['লক্ষণ: হঠাৎ উচ্চ জ্বর, প্রচণ্ড মাথা ও চোখের পেছনে ব্যথা, গা-হাত-পায়ে ব্যথা, ফুসকুড়ি, বমি ভাব।','জ্বর হলে ডাক্তারকে দেখান ও রক্ত পরীক্ষার (এনএস১/সিবিসি) পরামর্শ নিন।','বিশ্রাম নিন এবং প্রচুর তরল খান: ওআরএস, স্যুপ, ডাবের পানি, ভাতের মাড়, ফলের রস।','জ্বর/ব্যথায় শুধু প্যারাসিটামল (নির্দেশমতো)। অন্য ব্যথার ওষুধ নয়।','রোগী দিনে মশারির ভেতরে থাকুন যাতে মশা কামড়ে অন্যদের ছড়াতে না পারে।','প্রস্রাব কতবার হচ্ছে লক্ষ করুন; প্রতিদিন প্রস্রাব স্বাভাবিক থাকা ভালো লক্ষণ।','বাড়ি-আঙিনায় জমা পরিষ্কার পানি (ফুলের টব, ডাব, টায়ার, এসির ট্রে) সপ্তাহে একবার ফেলে দিন।'],
 d:['অ্যাসপিরিন, আইবুপ্রোফেন, ডাইক্লোফেনাক, নেপ্রোক্সেন — এগুলো রক্তপাত বাড়াতে পারে।','নিজে নিজে স্টেরয়েড বা অ্যান্টিবায়োটিক খাবেন না।','প্লাটিলেট কমে গেছে শুনে ঘাবড়ে অপ্রয়োজনে হাসপাতালে ভর্তি হতে ছুটবেন না — সিদ্ধান্ত ডাক্তারের।']},
{id:'faint',c:'sick',i:'😵',t:'মাথা ঘুরে অজ্ঞান হওয়া',s:'g',k:'অজ্ঞান fainting মাথা ঘুরে পড়ে গেছে চোখ অন্ধকার',
 w:'১ মিনিটে জ্ঞান না ফিরলে, বুকে ব্যথা, খিঁচুনি, আঘাত, গর্ভবতী বা হৃদরোগী হলে বা বারবার হলে ডাক্তার/৯৯৯।',
 a:['রোগীকে চিত করে শুইয়ে দিন এবং পা ১২ ইঞ্চির মতো উঁচু করুন।','জামা ঢিলা করুন, বাতাস করুন, ভিড় সরান।','জ্ঞান ফিরলে ধীরে ধীরে বসান, তারপর দাঁড় করান। তাড়াহুড়ো নয়।','সজাগ হলে ঠান্ডা পানি/ওআরএস সামান্য খাওয়ান। ডায়াবেটিস থাকলে চিনি/গ্লুকোজ।','না নড়লে বা শ্বাস না থাকলে "অজ্ঞান" বা সিপিআর অনুযায়ী ব্যবস্থা নিন।'],
 d:['জ্ঞান ফেরার আগে খাবার-পানি দেবেন না।','মুখে পানির ঝাপটা না দিলেও চলে, জোরে ঝাঁকাবেন না।']},
{id:'sugar',c:'sick',i:'🍬',t:'ডায়াবেটিস রোগীর সুগার কমে যাওয়া',s:'o',k:'সুগার কমে গেছে hypoglycemia ডায়াবেটিস কাঁপছে ঘাম ইনসুলিন',
 w:'অজ্ঞান, গিলতে না পারা, খিঁচুনি, ১৫ মিনিটে ভালো না হলে — ৯৯৯।',
 a:['লক্ষণ: কাঁপুনি, ঘাম, ক্ষুধা, মাথা ঘোরা, বিভ্রান্তি, দুর্বলতা, মেজাজ বিগড়ানো — বিশেষ করে ইনসুলিন/সালফোনাইলইউরিয়া খাওয়া ব্যক্তিতে।','সুগার মাপার ব্যবস্থা থাকলে মাপুন (৭০ মিগ্রা/ডিএল-এর কম ধরুন)। না থাকলে সন্দেহ হলে-ই খাওয়ান।','সজাগ থাকলে দ্রুত শর্করা: ৩ চা-চামচ চিনি পানিতে, বা গ্লুকোজ, বা আধা কাপ ফলের রস, বা ৩-৪টি গ্লুকোজ ট্যাবলেট।','১৫ মিনিট পর আবার মাপুন; ভালো না হলে একই পরিমাণ আবার দিন।','ভালো হলে সাধারণ খাবার (ভাত, রুটি, বিস্কুট) খেতে বলুন। ডাক্তারকে জানান।'],
 d:['অজ্ঞান বা গিলতে না পারা ব্যক্তির মুখে কিছু দেবেন না (দম আটকাতে পারে)।','ইনসুলিন বা ওষুধের বাড়তি ডোজ দেবেন না।','রোগী ভালো হয়ে গেলেও পরে সুগার আবার নামতে পারে — নজর রাখুন।']},
{id:'preg',c:'sick',i:'🤰',t:'গর্ভাবস্থা ও প্রসবের বিপদ-চিহ্ন',s:'r',k:'গর্ভবতী pregnancy প্রসব ব্যথা রক্তপাত খিঁচুনি এক্লাম্পসিয়া পানি ভাঙা',
 w:'নিচের যেকোনো একটি থাকলে দেরি না করে হাসপাতালে — ৯৯৯ বা ১৬২৬৩।',
 a:['বিপদ-চিহ্ন: যোনিপথে রক্তপাত (গর্ভাবস্থায় বা প্রসবের পর), তীব্র মাথাব্যথা/চোখে ঝাপসা/হাত-মুখ ফোলা (উচ্চ রক্তচাপ), খিঁচুনি, তীব্র পেটব্যথা, জ্বর, পানি ভেঙে যাওয়া, শিশুর নড়াচড়া কমে যাওয়া বা বন্ধ হওয়া, ৯ মাসের আগে ব্যথা।','রোগীকে বাম কাতে শুইয়ে রাখুন, শান্ত রাখুন।','যানবাহন ও হাসপাতাল আগে থেকে ঠিক রাখুন; গর্ভবতীর কাগজপত্র (এএনসি কার্ড, আল্ট্রা রিপোর্ট) সাথে নিন।','খিঁচুনি হলে "খিঁচুনি" পাতার নিয়ম অনুসরণ করে দ্রুত যান।','প্রসবের পর অতিরিক্ত রক্তপাত হলে পেটের ওপর (জরায়ু) হাত দিয়ে মালিশ করতে পারেন এবং সঙ্গে সঙ্গে হাসপাতালে যান।'],
 d:['দাইয়ের ভরসায় বাড়িতে সময় নষ্ট করবেন না।','রক্তপাত বা খিঁচুনি হলে "দেখি আরেকটু" করবেন না।','নিজে ওষুধ বা ইনজেকশন (প্রসব বেদনা বাড়ানোর) দেবেন না।'],
 n:'সুরক্ষিত প্রসবের জন্য নিকটস্থ হাসপাতাল/স্বাস্থ্যকেন্দ্র আগে থেকেই ঠিক রাখুন।'},

{id:'fire',c:'dis',i:'🔥',t:'আগুন লাগলে',s:'r',k:'আগুন fire অগ্নিকাণ্ড ধোঁয়া ফায়ার সার্ভিস ১০২',
 w:'আগুন লাগামাত্র ১০২ (ফায়ার সার্ভিস) বা ৯৯৯ — আগে বের হোন, পরে ফোন।',
 a:['চিৎকার করে সবাইকে সতর্ক করুন, ফায়ার অ্যালার্ম থাকলে বাজান।','সবাইকে নিয়ে দ্রুত বের হোন — জিনিস, টাকা বা মোবাইল আনতে ফিরবেন না।','ধোঁয়ায় ভরা জায়গায় নিচু হয়ে (হামাগুড়ি) চলুন; ভেজা কাপড়ে নাক-মুখ ঢেকে রাখুন।','দরজা খোলার আগে হাতের পিঠ দিয়ে ছুঁয়ে দেখুন — গরম হলে খুলবেন না, অন্য পথ নিন।','লিফট ব্যবহার করবেন না — সিঁড়ি দিয়ে নামুন।','কাপড়ে আগুন ধরলে: থামুন, মাটিতে শুয়ে গড়ান।','বাইরে এসে ১০২ বা ৯৯৯-এ ঠিকানাসহ জানান।','আটকা পড়লে: দরজা বন্ধ করে ফাঁকে ভেজা কাপড় ঠেসে দিন; জানালায় এসে কাপড় নাড়িয়ে সংকেত দিন; ফোনে নিজের অবস্থান জানান।','ছোট আগুন (তেল/বৈদ্যুতিক হলে পানি নয়): ঢাকনা/ভেজা কম্বল দিয়ে চাপা দিন বা এক্সটিংগুইশার ব্যবহার করুন (টানুন-মারুন-চাপুন-ঘোরান)।'],
 d:['তেলের বা বৈদ্যুতিক আগুনে পানি ঢালবেন না।','ধোঁয়ার ভেতরে দাঁড়িয়ে থাকবেন না বা লুকাবেন না।','জানালা-দরজা খুলে দেবেন না যদি আগুন ভেতরে থাকে (বাতাস পেলে বাড়ে) — বেরোনোর সময় বন্ধ করে যান।']},
{id:'quake',c:'dis',i:'🏚️',t:'ভূমিকম্প',s:'r',k:'ভূমিকম্প earthquake কাঁপছে দালান ধসে',
 w:'কাঁপুনি থামলে নিরাপদে বের হোন; আটকা পড়লে সাহায্য ডাকুন।',
 a:['কাঁপুনি শুরু হলে: নিচু হোন, শক্ত টেবিল/খাটের নিচে ঢুকুন (বা কোণে বসে মাথা-ঘাড় দুই হাতে ঢাকুন), ধরে থাকুন।','জানালা, আয়না, ঝোলানো জিনিস, বইয়ের তাক থেকে দূরে থাকুন।','লিফট ব্যবহার করবেন না। বারান্দা/সিঁড়ির দিকে ছুটবেন না।','বাইরে থাকলে খোলা জায়গায় যান — দালান, গাছ, বিদ্যুতের তার থেকে দূরে।','কাঁপুনি থামলে গ্যাস/বিদ্যুতের লাইন বন্ধ করুন, ফাটলধরা বাড়ি থেকে সাবধানে বের হোন। পরে ছোট কম্পন (আফটারশক) আসতে পারে।','ধ্বংসস্তূপে আটকা পড়লে: নাক-মুখ কাপড়ে ঢাকুন, দেয়াল বা পাইপে টোকা দিয়ে শব্দ করুন (চিৎকার করে ধুলো গিলবেন না), হুইসেল থাকলে বাজান।'],
 d:['দৌড়ে বেরোতে গিয়ে সিঁড়িতে ভিড় করবেন না।','ম্যাচ বা লাইটার জ্বালাবেন না (গ্যাস লিক হতে পারে)।','ধ্বংসস্তূপে আটকা মানুষকে অন্ধভাবে টেনে বের করবেন না।']},
{id:'light',c:'dis',i:'⛈️',t:'বজ্রপাত',s:'r',k:'বজ্রপাত বাজ lightning বাজ পড়া ঝড় মাঠ ধান',
 w:'বজ্রপাতে আক্রান্তকে ছুঁলে বিদ্যুৎ লাগে না — সঙ্গে সঙ্গে চিকিৎসা দিন, শ্বাস না থাকলে সিপিআর ও ৯৯৯।',
 a:['মেঘ ডাকলে বা বজ্রপাতের আভাস হলে সঙ্গে সঙ্গে পাকা বাড়ি বা বদ্ধ গাড়িতে আশ্রয় নিন।','মাঠ, খোলা জায়গা, উঁচু গাছ, পুকুর/হাওর/নদী-খাল, ধাতব খুঁটি, বিদ্যুতের তার থেকে দূরে থাকুন। জেলে/কৃষক নৌকা বা মাঠে থাকলে দ্রুত তীরে/পাকা ঘরে যান।','ফাঁকা জায়গায় আটকা পড়লে: পা একসাথে করে হাঁটু ভাঁজ করে নিচু হয়ে বসুন, মাথা নিচু ও কান ঢেকে রাখুন। শুয়ে পড়বেন না।','ঘরের ভেতরে: জানালা-দরজা বন্ধ রাখুন, বিদ্যুৎ-সংযুক্ত যন্ত্রপাতি, চার্জে থাকা ফোন/ল্যাপটপ, ধাতব কল-পাইপ ছোঁবেন না।','শেষ বজ্রপাতের ৩০ মিনিট পর বের হোন।','আক্রান্ত ব্যক্তির শ্বাস/নাড়ি না থাকলে সঙ্গে সঙ্গে সিপিআর। পোড়া থাকলে ঢেকে দিন।'],
 d:['গাছের নিচে দাঁড়াবেন না।','ছাতা/ধাতব জিনিস উঁচু করে ধরবেন না।','বজ্রপাতের সময় সাঁতার/পানিতে নামবেন না।'],
 n:'বাংলাদেশে বজ্রপাত বছরে কয়েকশ মানুষের প্রাণ নেয় — বিশেষ করে এপ্রিল-জুন, খোলা মাঠে কৃষক ও জেলেরা। আবহাওয়া সংকেত শুনুন।'},
{id:'cyc',c:'dis',i:'🌀',t:'ঘূর্ণিঝড় ও বন্যা',s:'o',k:'ঘূর্ণিঝড় cyclone বন্যা flood জলোচ্ছ্বাস সংকেত আশ্রয়কেন্দ্র',
 w:'সংকেত বাড়লে (৪ নম্বর বা তার বেশি) দেরি না করে আশ্রয়কেন্দ্রে যান।',
 a:['আবহাওয়া সংকেত রেডিও/টিভি/মোবাইলে নজরে রাখুন। ঘূর্ণিঝড় প্রস্তুতি কর্মসূচি (সিপিপি) স্বেচ্ছাসেবকদের নির্দেশ মানুন।','জরুরি ব্যাগ তৈরি রাখুন: শুকনো খাবার, ফোটানো/বোতলের পানি, ওআরএস, প্রয়োজনীয় ওষুধ, টর্চ, পাওয়ার ব্যাংক, জরুরি কাগজ (ছবি/কপি জিপ ব্যাগে), নগদ টাকা, বাতি।','আশ্রয়কেন্দ্রে যান — শিশু, বৃদ্ধ, অন্তঃসত্ত্বা, প্রতিবন্ধীদের আগে নিন। গবাদি পশু ও জিনিস ঊর্ধ্বে/নিরাপদে বাঁধুন।','ঘর ছাড়ার আগে বিদ্যুৎ ও গ্যাস লাইন বন্ধ করুন।','বন্যায়: বন্যার পানিতে হাঁটবেন না (সাপ, খোলা তার, লুকানো গর্ত, রোগজীবাণু)। পানি ফুটিয়ে (অন্তত ১ মিনিট) বা ক্লোরিন ট্যাবলেটে বিশুদ্ধ করে খান।','ঝড়ের পর ঝুলন্ত তার, ক্ষতিগ্রস্ত ঘর থেকে দূরে থাকুন। পচা/ভেজা খাবার খাবেন না।'],
 d:['"আগেও বেঁচে গেছি" ভেবে আশ্রয়কেন্দ্র এড়াবেন না।','ঝড়ের মধ্যে নৌকা বা বাইরে বের হবেন না।','বন্যার পানি সরাসরি খাবেন না।']},

 w:'তাৎক্ষণিক বিপদ হলে (পদক্ষেপ নিয়েছে, উপায় হাতের কাছে) — ৯৯৯, একা রাখবেন না। যে-কেউ চাইলে কথা বলার জন্য নিচের সহায়তা-লাইনগুলো আছে।',

const CPR={adult:{n:'প্রাপ্তবয়স্ক',st:['নিরাপদ কি দেখুন। কাঁধে চাপড় দিয়ে জোরে ডাকুন। সাড়া নেই?','সাহায্য ডাকুন ও ৯৯৯-এ ফোন করে স্পিকারে রাখুন। কাছে AED (ডিফিব্রিলেটর) থাকলে আনতে বলুন।','শ্বাস দেখুন (১০ সেকেন্ড)। শ্বাস না থাকলে বা শুধু হাঁপানোর মতো — সিপিআর শুরু।','শক্ত সমতল জায়গায় চিত করুন। বুকের মাঝখানে (বুকের হাড়ের নিচের অর্ধেক) এক হাতের তালুর গোড়া, তার ওপর অন্য হাত, কনুই সোজা।','জোরে ও দ্রুত চাপুন: প্রতি মিনিটে ১০০–১২০ বার, গভীরতা প্রায় ৫–৬ সেমি। প্রতিবার বুক পুরো উঠতে দিন।','প্রশিক্ষণ থাকলে ৩০ চাপের পর ২ বার শ্বাস (মাথা পেছনে, থুতনি উঁচু, নাক চেপে ১ সেকেন্ডে ফুঁ, বুক ওঠা দেখুন)। প্রশিক্ষণ না থাকলে থামাবেন না — শুধু বুকে চাপ চালিয়ে যান।','AED এলে চালু করে কণ্ঠস্বরের নির্দেশ মানুন।','থামবেন না — যতক্ষণ না সাহায্য আসে, রোগী নড়ে বা শ্বাস নেয়, অথবা আপনি আর পারছেন না। ২ মিনিট পর অন্য কেউ বদলি নিতে পারে।']},
 child:{n:'শিশু (১–৮ বছর)',st:['সাড়া ও শ্বাস দেখুন। সাড়া নেই ও শ্বাস নেই?','সাহায্য ডাকুন। একা হলে ১ মিনিট সিপিআর দিয়ে তারপর ৯৯৯ (বা ফোন স্পিকারে রেখে শুরু করুন)।','শিশুদের (ডুবে যাওয়া, দম আটকানো) ক্ষেত্রে আগে ৫ বার মুখে শ্বাস দিন (প্রশিক্ষণ থাকলে)।','বুকের মাঝখানে এক হাতের তালুর গোড়া (ছোট হলে দুই আঙুলে ঠিক হবে না — এক হাত), গভীরতা বুকের প্রায় ১/৩ (৫ সেমি)।','৩০ চাপ : ২ শ্বাস। গতি ১০০–১২০/মিনিট। শ্বাস কম জোরে, শুধু বুক ওঠা পর্যন্ত।','AED থাকলে শিশুদের প্যাড/মোড (না থাকলে বড়দেরটাই) ব্যবহার করুন।','সাহায্য না আসা বা শিশু নড়ে ওঠা পর্যন্ত চালিয়ে যান।']},
 baby:{n:'শিশু (১ বছরের কম)',st:['পায়ের তলায় আলতো টোকা দিন ও ডাকুন। সাড়া ও শ্বাস না থাকলে সাহায্য ডাকুন।','প্রথমে ৫ বার শ্বাস: আপনার মুখ দিয়ে শিশুর মুখ ও নাক একসাথে ঢেকে ছোট ছোট ফুঁ (গালের ফুঁ, জোরে নয়)।','বুকের মাঝখানে (স্তনবৃন্তের রেখার সামান্য নিচে) দুই আঙুল রাখুন।','দুই আঙুলে চাপুন: গভীরতা বুকের প্রায় ১/৩ (প্রায় ৪ সেমি), গতি ১০০–১২০/মিনিট।','৩০ চাপ : ২ আলতো শ্বাস।','একা হলে ১ মিনিট সিপিআর করে তারপর ৯৯৯-এ ফোন (স্পিকারে রেখে শুরু করাই ভালো)।','চালিয়ে যান যতক্ষণ না সাহায্য আসে বা শিশু নড়ে ও কাঁদে।']}};

let AC=null;function beep(f,d,g){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),n=AC.createGain();o.type='square';o.frequency.value=f;n.gain.setValueAtTime(g||.2,AC.currentTime);n.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.connect(n);n.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
function cprStop(){clearInterval(cprT.iv);clearInterval(cprT.tmr);cprT.on=false;cprT.iv=null;try{cprT.wl&&cprT.wl.release()}catch(e){}cprT.wl=null}
function cprStart(){cprStop();cprT.on=true;cprT.beat=0;cprT.t0=Date.now();try{navigator.wakeLock&&navigator.wakeLock.request('screen').then(w=>cprT.wl=w).catch(()=>{})}catch(e){}
 let pause=0;
 const tick=()=>{const pl=$('#pl'),cn=$('#cn');if(!pl){cprStop();return}
  if(cprT.mode=='302'){if(pause>0){pause--;pl.textContent='শ্বাস';cn.textContent='২টি শ্বাস দিন…';if(pause==0)cprT.beat=0;return}}
  cprT.beat++;pl.textContent=B(cprT.beat);beep(cprT.beat==1?900:700,.06);try{navigator.vibrate&&navigator.vibrate(40)}catch(e){}
  cn.textContent=cprT.mode=='302'?'৩০টির মধ্যে '+B(cprT.beat):'চাপ চালিয়ে যান';
  if(cprT.mode=='302'&&cprT.beat>=30){pause=5;cn.textContent='এবার ২টি শ্বাস'}};
 cprT.iv=setInterval(tick,545);tick();
 cprT.tmr=setInterval(()=>{const e=$('#el');if(!e){cprStop();return}const s=Math.floor((Date.now()-cprT.t0)/1000);e.textContent='সময়: '+B(Math.floor(s/60))+' মি '+B(s%60)+' সে'},1000)}

function vLoc(){return hd('📍 আমার অবস্থান')+`<div class="box">জিপিএস ইন্টারনেট ছাড়াও কাজ করতে পারে (খোলা আকাশের নিচে ভালো)। নিচের বোতাম চাপলে অক্ষাংশ-দ্রাঘিমাংশ আসবে — ৯৯৯-কে বা কাউকে পাঠান।</div><button class="btn g" id="gps">📍 অবস্থান খুঁজুন</button><div id="lres" style="margin-top:12px">${LOC?locH():''}</div>`}
const locH=()=>`<div class="card-big"><h3>আপনার অবস্থান</h3><div class="big">${LOC.la}, ${LOC.lo}</div><div class="muted">নির্ভুলতা ≈ ${B(Math.round(LOC.ac))} মিটার</div></div><div class="row"><button class="btn" id="lcp">📋 কপি</button><button class="btn" id="lsh">📤 শেয়ার</button></div>`;
const locTxt=()=>`জরুরি! আমার অবস্থান: ${LOC.la}, ${LOC.lo} (নির্ভুলতা ≈${Math.round(LOC.ac)} মি)। মানচিত্র: https://maps.google.com/?q=${LOC.la},${LOC.lo}`;
/* ---- card ---- */
const BG=['A+','A−','B+','B−','AB+','AB−','O+','O−'];
function vCard(){const c=LS.g('card',null);
 if(c&&!window.__edit)return hd('🪪 মেডিক্যাল কার্ড')+`<div class="card-big"><h3>🆘 জরুরি তথ্য${c.name?' — '+E(c.name):''}</h3><div class="kv"><b>বয়স</b><span>${B(E(c.age||'—'))}</span><b>রক্তের গ্রুপ</b><span style="font-weight:800;color:#c62828">${E(c.bg||'—')}</span><b>অ্যালার্জি</b><span>${E(c.al||'—')}</span><b>রোগ</b><span>${E(c.dis||'—')}</span><b>নিয়মিত ওষুধ</b><span>${E(c.med||'—')}</span><b>জরুরি যোগাযোগ</b><span>${E(c.cn||'—')} ${c.cp?`<a class="btn sm r" href="${tel(c.cp)}">📞 ${B(E(c.cp))}</a>`:''}</span></div></div><div class="muted">এই তথ্য শুধু আপনার ফোনেই আছে, কোথাও যায় না। এই পাতার স্ক্রিনশট নিয়ে ফোনের লক-স্ক্রিন ওয়ালপেপার করতে পারেন।</div><div class="row" style="margin-top:10px"><button class="btn" id="cedit">✏️ বদলান</button><button class="btn w" id="cdel">🗑 মুছুন</button></div>`;
 const v=c||{};const f=(k,l,ph,t)=>`<label class="fld"><span>${l}</span><input id="f_${k}" ${t?`type="${t}"`:''} value="${E(v[k]||'')}" placeholder="${ph||''}"></label>`;
 return hd('🪪 মেডিক্যাল কার্ড')+`<div class="box">জরুরি অবস্থায় চিকিৎসক বা উদ্ধারকারীর জন্য। শুধু এই ফোনে সংরক্ষিত হবে।</div>${f('name','নাম','')}${f('age','বয়স','','tel')}<label class="fld"><span>রক্তের গ্রুপ</span><select id="f_bg"><option value="">জানি না</option>${BG.map(b=>`<option ${v.bg==b?'selected':''}>${b}</option>`).join('')}</select></label>${f('al','অ্যালার্জি (ওষুধ/খাবার)','যেমন: পেনিসিলিন')}${f('dis','রোগ (ডায়াবেটিস, হাঁপানি…)','')}${f('med','নিয়মিত ওষুধ','')}${f('cn','জরুরি যোগাযোগের নাম','যেমন: আব্বু')}${f('cp','জরুরি যোগাযোগের নম্বর','01XXXXXXXXX','tel')}<button class="btn g" id="csave">💾 সংরক্ষণ করুন</button>`}
/* ---- kit ---- */
function vKit(){const d=LS.g('kit',{});const n=KIT.filter((_,i)=>d[i]).length;
 return hd('🧰 ফার্স্ট এইড কিট')+`<div class="box">ঘরে একটি বাক্সে এগুলো রাখুন, ছোটদের নাগালের বাইরে। <b>${B(n)}/${B(KIT.length)}</b> আছে।</div>`+KIT.map((k,i)=>`<label class="chk ${d[i]?'on':''}"><input type="checkbox" data-k="${i}" ${d[i]?'checked':''}><span>${E(k)}</span></label>`).join('')+`<div class="muted">ওষুধ মেয়াদ দেখে বদলান। অ্যান্টিবায়োটিক নিজে মজুত রাখবেন না — ডাক্তার যা দেন তা-ই।</div>`}
function vMyths(){return hd('💡 ভুল ধারণা ও সত্য')+MYTHS.map(m=>`<div class="myth"><b>❌ ${E(m[0])}</b>${E(m[1])}</div>`).join('')}
function vLight(){return hd('🔦 স্ক্রিন-আলো ও SOS')+`<div class="box">অন্ধকারে সংকেত বা আলোর জন্য। পর্দার উজ্জ্বলতা নিজে সর্বোচ্চ করুন।</div><button class="btn" id="lw" style="background:#fff;color:#222;border:2px solid #222;padding:22px">⚪ সাদা আলো</button><div style="height:10px"></div><button class="btn r" id="ls" style="padding:22px">🆘 লাল-কালো ঝলক (SOS)</button><div class="muted" style="margin-top:8px">বন্ধ করতে পর্দায় টোকা দিন।</div>`}
function vAbout(){return hd('ℹ️ সীমাবদ্ধতা ও তথ্য')+`<div class="box when"><h3>⚠️ গুরুত্বপূর্ণ</h3>এটি সাধারণ প্রাথমিক চিকিৎসার তথ্য — ডাক্তার, প্রশিক্ষণ বা জরুরি সেবার বিকল্প নয়। গুরুতর অবস্থায় আগে ৯৯৯।</div>
 <div class="box"><h3>কীভাবে বানানো</h3>লেখাগুলো আন্তর্জাতিক সাধারণ নীতি (WHO, রেড ক্রস/রেড ক্রিসেন্ট, রিসাসিটেশন কাউন্সিল ধরনের নির্দেশিকা) ও বাংলাদেশের পরিস্থিতি (সাপ, বজ্রপাত, ডেঙ্গু, কীটনাশক, ডায়রিয়া) মাথায় রেখে নিজের ভাষায় লেখা। পাঠ্য কপি করা নয়।</div>
 <div class="box"><h3>সীমা</h3><ul class="nl"><li>বইয়ের মতো প্রশিক্ষণ হাতে-কলমে শেখার বিকল্প নয়। বাংলাদেশ রেড ক্রিসেন্ট সোসাইটি ইত্যাদির ফার্স্ট এইড কোর্স করুন।</li><li>ওষুধের মাত্রা (বিশেষ করে শিশুর) এখানে নেই — প্যাকেটের লেবেল/ডাক্তার/ফার্মাসিস্ট দেখুন।</li><li>ফোন নম্বর বদলাতে পারে।</li><li>পড়ে শোনানোর জন্য ফোনে বাংলা ভয়েস লাগে; না থাকলে শব্দ আসবে না।</li><li>এই অ্যাপ ডাক্তার দ্বারা পর্যালোচিত নয়। ছড়ানোর আগে একজন চিকিৎসককে দেখিয়ে নিন।</li></ul></div>
 <div class="box"><h3>গোপনীয়তা</h3>কোনো তথ্য ইন্টারনেটে যায় না। মেডিক্যাল কার্ড ও নম্বর শুধু আপনার ফোনের ব্রাউজারে থাকে।</div>
 <div class="muted">সংস্করণ ${APP_VER}</div>`}
/* ---- router ---- */
function route(){const h=location.hash||'#/';const p=h.slice(2).split('/');cprStop();TTS.stop();window.__edit=false;window.__speak=null;
 const V={'':vHome,c:()=>vCat(p[1]),g:()=>vGuide(p[1]),cpr:vCpr,nums:vNums,speak:vSpeak,loc:vLoc,card:vCard,kit:vKit,myths:vMyths,light:vLight,about:vAbout};
 $('#app').innerHTML=(V[p[0]]||vHome)();window.scrollTo(0,0);bind(p[0])}
function bind(p){
 const q=$('#q');if(q)q.oninput=()=>{window.__q=q.value;const pos=q.selectionStart;$('#app').innerHTML=vHome();const n=$('#q');n.focus();n.setSelectionRange(pos,pos);bind('')};
 const on=(s,f)=>document.querySelectorAll(s).forEach(e=>e.onclick=()=>f(e));
 on('#spk',()=>{if(!TTS.hasBn())toast('বাংলা ভয়েস নাও থাকতে পারে');TTS.say(window.__speak||[...document.querySelectorAll('ol.st li')].map(l=>l.textContent))});on('#spkx',()=>TTS.stop());
 on('#fsm',()=>{fsz=Math.max(14,fsz-1);LS.s('fs',fsz);document.documentElement.style.setProperty('--fs',fsz+'px')});on('#fsp',()=>{fsz=Math.min(26,fsz+2);LS.s('fs',fsz);document.documentElement.style.setProperty('--fs',fsz+'px')});
 on('#refr',()=>refreshApp());
 on('[data-tab]',e=>{cprT.tab=e.dataset.tab;route()});on('[data-mode]',e=>{cprT.mode=e.dataset.mode;route()});on('#cgo',()=>{if(cprT.on){cprStop();route()}else{cprStart();const b=$('#cgo');b.className='btn r';b.textContent='⏹ বন্ধ';$('#pl').className='pulse go'}});
 on('#madd',()=>{const n=$('#mn').value.trim(),ph=$('#mp').value.trim();if(!n||!ph){toast('নাম ও নম্বর দিন');return}const m=LS.g('mine',[]);m.push({n,p:ph});LS.s('mine',m);route()});on('[data-del]',e=>{const m=LS.g('mine',[]);m.splice(+e.dataset.del,1);LS.s('mine',m);route()});
 on('#gps',e=>{if(!navigator.geolocation){toast('এই ফোনে জিপিএস নেই');return}e.textContent='খোঁজা হচ্ছে… (খোলা জায়গায় থাকুন)';navigator.geolocation.getCurrentPosition(p=>{LOC={la:p.coords.latitude.toFixed(5),lo:p.coords.longitude.toFixed(5),ac:p.coords.accuracy};e.textContent='📍 আবার খুঁজুন';$('#lres').innerHTML=locH();bind('loc')},er=>{e.textContent='📍 অবস্থান খুঁজুন';toast('অবস্থান পাওয়া যায়নি — লোকেশন চালু ও অনুমতি দিন')},{enableHighAccuracy:true,timeout:30000,maximumAge:0})});
 on('#lcp',()=>{try{navigator.clipboard.writeText(locTxt()).then(()=>toast('কপি হয়েছে'),()=>toast(locTxt()))}catch(e){toast(locTxt())}});on('#lsh',()=>{try{navigator.share?navigator.share({text:locTxt()}):toast('শেয়ার সম্ভব নয়, কপি করুন')}catch(e){}});
 on('#csave',()=>{const c={};['name','age','bg','al','dis','med','cn','cp'].forEach(k=>c[k]=($('#f_'+k).value||'').trim());LS.s('card',c);toast('সংরক্ষিত');route()});on('#cedit',()=>{window.__edit=true;$('#app').innerHTML=vCard();bind('card')});on('#cdel',()=>{if(confirm('মুছে ফেলবেন?')){try{localStorage.removeItem('fa.card')}catch(e){}route()}});
 document.querySelectorAll('[data-k]').forEach(c=>c.onchange=()=>{const d=LS.g('kit',{});d[c.dataset.k]=c.checked;LS.s('kit',d);route()});
 on('#lw',()=>full('w','',''));on('#ls',()=>full('s','SOS','🆘'));
}
function full(k,t,e){const d=document.createElement('div');d.className='full '+k;d.innerHTML=`<div><div style="font-size:70px">${e}</div>${t}</div>`;d.onclick=()=>d.remove();document.body.appendChild(d)}
async function refreshApp(){try{const rs=await navigator.serviceWorker.getRegistrations();for(const r of rs)await r.unregister();const ks=await caches.keys();for(const k of ks)await caches.delete(k)}catch(e){}location.reload()}
window.addEventListener('hashchange',route);
route();
